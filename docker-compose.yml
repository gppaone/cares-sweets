services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cares
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cares
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cares -d cares"]
      interval: 5s
      timeout: 5s
      retries: 12

  foodtruck:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cares:${POSTGRES_PASSWORD}@db:5432/cares
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: ${TZ:-America/New_York}
      UPLOAD_DIR: /data/uploads
      BODY_SIZE_LIMIT: 20M
    volumes:
      - uploads:/data/uploads
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  uploads:

networks:
  proxy:
    name: web
    external: true
